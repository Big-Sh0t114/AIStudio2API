name: Format Notebook frontend (temporary)

on:
  push:
    branches: [fix/notebook-frontend-format]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format changed Vue components
        working-directory: web
        run: |
          npm ci
          npx vp fmt src/components/NotebookPanel.vue src/components/AccountsPanel.vue src/components/UsagePanel.vue
      - name: Commit formatting
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- web/src/components/NotebookPanel.vue web/src/components/AccountsPanel.vue web/src/components/UsagePanel.vue; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/components/NotebookPanel.vue web/src/components/AccountsPanel.vue web/src/components/UsagePanel.vue
          git commit -m "style(notebook): format Vue components with Vite+"
          git push origin HEAD:fix/notebook-frontend-format
