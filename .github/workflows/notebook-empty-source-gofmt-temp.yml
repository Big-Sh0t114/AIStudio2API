name: Format empty-source Notebook chat (temporary)

on:
  push:
    branches: [feat/notebook-empty-source-chat]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format Notebook source-free chat
        run: gofmt -w internal/notebook/rpc.go internal/notebook/empty_source_chat_test.go
      - name: Commit formatter changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/notebook/rpc.go internal/notebook/empty_source_chat_test.go
          git commit -m "style(notebook): gofmt empty-source chat adapter"
          git push origin HEAD:feat/notebook-empty-source-chat
