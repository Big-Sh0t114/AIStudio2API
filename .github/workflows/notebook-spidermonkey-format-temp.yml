name: Format Notebook SpiderMonkey Go changes (temporary)

on:
  push:
    branches: [feature/notebook-spidermonkey-http]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format SpiderMonkey Notebook integration
        run: |
          gofmt -w internal/aistudio/notebook_http.go internal/app/notebook_spidermonkey.go internal/app/notebook_shared.go internal/notebook/http_transport.go internal/notebook/http_transport_test.go internal/notebook/browser.go internal/notebook/provider.go internal/notebook/shared.go internal/notebook/rpc.go
      - name: Commit formatter changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/aistudio/notebook_http.go internal/app/notebook_spidermonkey.go internal/app/notebook_shared.go internal/notebook/http_transport.go internal/notebook/http_transport_test.go internal/notebook/browser.go internal/notebook/provider.go internal/notebook/shared.go internal/notebook/rpc.go
          git commit -m "style(notebook): gofmt SpiderMonkey HTTP integration"
          git push origin HEAD:feature/notebook-spidermonkey-http
