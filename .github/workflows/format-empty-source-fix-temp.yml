name: Format source-free rejection handling (temporary)

on:
  push:
    branches: [feat/notebook-empty-source-chat]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format Notebook no-source files
        run: gofmt -w internal/notebook/rpc.go internal/notebook/empty_source_chat_test.go
      - name: Commit if changed
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/notebook/rpc.go internal/notebook/empty_source_chat_test.go
          git commit -m "style(notebook): format source-free rejection tests"
          git push origin HEAD:feat/notebook-empty-source-chat
