name: Format Notebook account dedupe (temporary)

on:
  push:
    branches: [fix/notebook-idempotent-account-binding]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format Notebook Vue
        working-directory: web
        run: |
          npm ci
          npx vp fmt src/components/NotebookPanel.vue
      - name: Format Go
        run: |
          gofmt -w internal/notebook/account_bindings.go internal/notebook/account_bindings_test.go internal/notebook/shared.go internal/notebook/provider.go internal/api/notebook_http.go
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/components/NotebookPanel.vue internal/notebook/account_bindings.go internal/notebook/account_bindings_test.go internal/notebook/shared.go internal/notebook/provider.go internal/api/notebook_http.go
          git commit -m "style(notebook): format account binding deduplication"
          git push origin HEAD:fix/notebook-idempotent-account-binding
