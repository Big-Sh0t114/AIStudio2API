name: Export formatted provider UI source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-export.yml
      - web/src/api.ts
      - web/src/components/ProvidersPanel.vue
      - web/src/locales/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format provider UI files
        working-directory: web
        run: |
          npm ci
          npx vp fmt src/api.ts src/components/ProvidersPanel.vue src/locales/*.ts
          cd ..
          tar -czf formatted-provider-ui.tar.gz web/src/api.ts web/src/components/ProvidersPanel.vue web/src/locales/*.ts
          git diff -- web/src/api.ts web/src/components/ProvidersPanel.vue web/src/locales/*.ts > formatted-provider-ui.patch
          git add web/src/api.ts web/src/components/ProvidersPanel.vue web/src/locales/*.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format alternate provider UI'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-provider-ui-source
          path: |
            formatted-provider-ui.tar.gz
            formatted-provider-ui.patch
          if-no-files-found: error
          retention-days: 1
