name: Format Notebook parallel requests (temporary)

on:
  push:
    branches: [feat/notebook-bounded-concurrency]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Go format
        run: |
          gofmt -w internal/notebook/provider.go internal/notebook/concurrency.go internal/notebook/concurrency_test.go internal/app/worker_manager.go internal/app/notebook_shared.go internal/camoufoxnative/worker.go
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/notebook/provider.go internal/notebook/concurrency.go internal/notebook/concurrency_test.go internal/app/worker_manager.go internal/app/notebook_shared.go internal/camoufoxnative/worker.go
          git commit -m "style(notebook): gofmt bounded concurrency"
          git push origin HEAD:feat/notebook-bounded-concurrency
