name: Format Notebook Go worker (temporary)

on:
  push:
    branches: [feature/notebook-playground-worker-reuse]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format Notebook Go files
        run: |
          gofmt -w internal/camoufoxnative/notebook.go internal/camoufoxnative/worker.go internal/camoufoxnative/notebook_cache_test.go internal/notebook/provider.go internal/notebook/rpc.go internal/notebook/metadata_cache_test.go
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/camoufoxnative/notebook.go internal/camoufoxnative/worker.go internal/camoufoxnative/notebook_cache_test.go internal/notebook/provider.go internal/notebook/rpc.go internal/notebook/metadata_cache_test.go
          git commit -m "style(notebook): format warm Worker and metadata cache"
          git push origin HEAD:feature/notebook-playground-worker-reuse
