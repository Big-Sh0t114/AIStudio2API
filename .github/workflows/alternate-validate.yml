name: Alternate providers (branch validation)

on:
  push:
    branches:
      - feat/report-antigravity-gemini-web-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alternate-unit:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format static check
        run: |
          files="$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.go' || true)"
          [ -n "$files" ] || exit 0
          echo "$files" | xargs gofmt -l
      - name: Alternate provider package tests
        run: go test -mod=readonly -count=1 -v ./internal/alternate
      - name: Vet alternate provider package
        run: go vet -mod=readonly ./internal/alternate
  full-compile:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend for embed
        working-directory: web
        run: |
          npm ci
          npx vp build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/static-libraries
        with:
          target: linux-amd64-gnu
      - name: Compile all internal packages
        run: go test -mod=readonly -run '^$' ./internal/...

  windows-exe:
    name: Build Windows EXE with alternate providers
    needs: [alternate-unit, full-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install MinGW LLVM toolchain
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/static-libraries
        with:
          target: windows-amd64
      - name: Cross-compile desktop executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
          jq '.fixed.file_version = "0.0.0" | .info["0000"].ProductVersion = "0.0.0"' build/windows/info.json > bin/info.json
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info bin/info.json -out cmd/aistudio2api/rsrc_windows_amd64.syso
          CC=x86_64-w64-mingw32-clang CXX=x86_64-w64-mingw32-clang++ GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -tags desktop,production -ldflags="-s -w -H windowsgui -extldflags '-Wl,--gc-sections -Wl,--icf=safe'" -o bin/aistudio2api.exe ./cmd/aistudio2api
          test -s bin/aistudio2api.exe
      - uses: actions/upload-artifact@v7
        with:
          name: aistudio2api-alternate-windows-amd64
          path: bin/aistudio2api.exe
          if-no-files-found: error
          retention-days: 30
