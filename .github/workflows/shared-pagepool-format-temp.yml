name: Format shared PagePool refactor (temporary)

on:
  push:
    branches: [refactor/shared-pagepool-for-playground-notebook]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Format shared Go modules
        run: |
          gofmt -w internal/pagepool/pool.go internal/pagepool/pool_test.go internal/aistudio/page_tabs.go internal/aistudio/accounts.go internal/aistudio/browser_operation_test.go internal/app/notebook_shared.go internal/camoufoxnative/worker.go internal/camoufoxnative/notebook.go internal/camoufoxnative/notebook_cache_test.go
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/pagepool internal/aistudio/page_tabs.go internal/aistudio/accounts.go internal/aistudio/browser_operation_test.go internal/app/notebook_shared.go internal/camoufoxnative/worker.go internal/camoufoxnative/notebook.go internal/camoufoxnative/notebook_cache_test.go
          git commit -m "style(pagepool): gofmt shared page scheduler"
          git push origin HEAD:refactor/shared-pagepool-for-playground-notebook
