name: Format Notebook model ID frontend (temporary)

on:
  push:
    branches: [feat/notebook-show-model-ids]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format Notebook component
        working-directory: web
        run: |
          npm ci
          npx vp fmt src/components/NotebookPanel.vue
      - name: Commit formatting changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/components/NotebookPanel.vue
          git commit -m "style(notebook): format visible request model IDs"
          git push origin HEAD:feat/notebook-show-model-ids
